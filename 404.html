<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 — Vynas Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c5a358">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container { max-width: 500px; padding: 2rem; }
        .code {
            font-family: 'Cinzel', serif;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, #c5a358, #fcd34d, #c5a358);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #555;
            margin: 1rem 0 2rem;
        }
        .desc {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.8;
            margin-bottom: 3rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 3rem;
            border: 1px solid rgba(197, 163, 88, 0.4);
            color: #c5a358;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            transition: all 0.4s ease;
        }
        .btn:hover {
            background: #c5a358;
            color: #000;
            box-shadow: 0 0 30px rgba(197, 163, 88, 0.3);
        }
        .vignette {
            position: fixed;
            inset: 0;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="vignette"></div>
    <main class="container" role="main">
        <h1 class="code">404</h1>
        <p class="subtitle">Señal Perdida</p>
        <p class="desc">
            Las coordenadas solicitadas no corresponden a ningún sector registrado en el sistema Vynas. 
            Es posible que el recurso haya sido reubicado o eliminado del archivo estelar.
        </p>
        <a href="index.html" class="btn" aria-label="Volver a la página principal">Regresar a Órbita</a>
    </main>
</body>

</html>
