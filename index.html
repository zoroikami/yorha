    <!-- Schema.org JSON-LD (Structured Data) -->

    {

    <script src="js/ola.js"></script>
    <script>
        // ════════════════════════════════════════════════════
        //  VIDEO REVERSE LOOP (existente)
        // ════════════════════════════════════════════════════
        const video = document.getElementById('saturn-video');
        let direction = 1;

        video.addEventListener('timeupdate', function () {
            if (direction === 1 && video.currentTime >= video.duration - 0.2) {
                direction = -1;
                reverseVideo();
            } else if (direction === -1 && video.currentTime <= 0.1) {
                direction = 1;
                video.play();
            }
        });

        function reverseVideo() {
            if (direction === -1) {
                video.currentTime -= 0.03;
                if (video.currentTime > 0) {
                    setTimeout(reverseVideo, 33);
                }
            }
        }

        // ════════════════════════════════════════════════════
        //  CUSTOM CURSOR + HOVER STATE
        // ════════════════════════════════════════════════════
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        // Hover state for interactive elements
        document.querySelectorAll('a, button, .magnetic-btn').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
        });

        // ════════════════════════════════════════════════════
        //  6. PARTÍCULAS FLOTANTES (Estrellas / Polvo cósmico)
        // ════════════════════════════════════════════════════
        const particlesCanvas = document.getElementById('particles-canvas');
        const pCtx = particlesCanvas.getContext('2d');
        let particles = [];

        function resizeParticles() {
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
        }
        resizeParticles();
        window.addEventListener('resize', resizeParticles);

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * particlesCanvas.height;
            }
            reset() {
                this.x = Math.random() * particlesCanvas.width;
                this.y = particlesCanvas.height + 10;
                this.size = Math.random() * 1.8 + 0.3;
                this.speedY = -(Math.random() * 0.4 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.6 + 0.1;
                this.fadeSpeed = Math.random() * 0.003 + 0.001;
                this.pulse = Math.random() * Math.PI * 2;
                this.isGold = Math.random() < 0.15;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.pulse += 0.02;
                this.opacity += Math.sin(this.pulse) * 0.003;
                if (this.y < -10 || this.opacity <= 0) this.reset();
            }
            draw() {
                const alpha = Math.max(0, Math.min(1, this.opacity));
                if (this.isGold) {
                    pCtx.fillStyle = `rgba(197, 163, 88, ${alpha})`;
                    pCtx.shadowColor = 'rgba(197, 163, 88, 0.5)';
                    pCtx.shadowBlur = 6;
                } else {
                    pCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    pCtx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                    pCtx.shadowBlur = 3;
                }
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                pCtx.fill();
                pCtx.shadowBlur = 0;
            }
        }

        // Create 120 particles
        for (let i = 0; i < 120; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ════════════════════════════════════════════════════
        //  7. BOTÓN MAGNÉTICO (se atrae al cursor)
        // ════════════════════════════════════════════════════
        document.querySelectorAll('.magnetic-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${x * 0.25}px, ${y * 0.35}px)`;
            });

            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'translate(0, 0)';
            });
        });
    </script>
